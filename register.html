<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ສະໝັກສະມາຊິກ · ຕາຕະລາງ ມ.ສ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a12; --surface:#12121e; --panel:#1a1a2e; --border:#252540;
  --accent:#6c63ff; --accent2:#ff6584; --accent3:#43e97b;
  --text:#e8e8f5; --text-muted:#6868a0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Lao',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 50% at 15% 10%,rgba(108,99,255,.1) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 85% 85%,rgba(255,101,132,.07) 0%,transparent 60%);
  pointer-events:none;z-index:0;}

.card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:38px 34px;width:440px;max-width:96vw;box-shadow:0 40px 100px rgba(0,0,0,.7);animation:slideUp .35s cubic-bezier(.16,1,.3,1);}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.brand{text-align:center;margin-bottom:22px;}
.brand .logo-text{font-family:'Bebas Neue',cursive;font-size:30px;letter-spacing:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand .logo-sub{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6;}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:22px;}
.tab{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;transition:all .18s;border:none;background:none;font-family:'Noto Sans Lao',sans-serif;}
.tab.active{background:linear-gradient(135deg,var(--accent),#9c8eff);color:#fff;box-shadow:0 4px 14px rgba(108,99,255,.4);}

.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
.field input{width:100%;background:var(--panel);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-family:'Noto Sans Lao',sans-serif;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.18);}

/* role picker */
.role-row{display:flex;gap:8px;}
.role-opt{flex:1;cursor:pointer;}
.role-opt input{display:none;}
.role-box{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;background:var(--panel);border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:700;transition:all .18s;color:var(--text-muted);}
.role-box .ic{font-size:20px;}
.role-opt input:checked + .role-box{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 3px rgba(108,99,255,.18);background:rgba(108,99,255,.1);}

.btn{width:100%;padding:13px;margin-top:8px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),#9c8eff);color:#fff;font-family:'Noto Sans Lao',sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(108,99,255,.4);transition:all .2s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(108,99,255,.55);}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}

.msg{font-size:12.5px;text-align:center;min-height:18px;margin-top:12px;line-height:1.7;}
.msg.err{color:var(--accent2);}
.msg.ok{color:var(--accent3);}

.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--text-muted);}
.foot a{color:var(--accent);text-decoration:none;font-weight:700;}
.foot a:hover{text-decoration:underline;}
.hide{display:none!important;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo-text">SNU TIMETABLE</div>
      <div class="logo-sub">ສະມາຊິກ ນັກຮຽນ / ອາຈານ<br>ຄະນະວິສະວະກຳສາດ ມ.ສ ສຸພານຸວົງ</div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabSignup" onclick="setMode('signup')">ສະໝັກສະມາຊິກ</button>
      <button class="tab" id="tabLogin" onclick="setMode('login')">ເຂົ້າສູ່ລະບົບ</button>
    </div>

    <!-- ຊ່ອງສະເພາະ ສະໝັກ -->
    <div id="signupOnly">
      <div class="field">
        <label>ຊື່ - ນາມສະກຸນ</label>
        <input type="text" id="fullName" placeholder="ເຊັ່ນ: ສຸເທວາ ວົງສະຫວັນ" autocomplete="name">
      </div>
      <div class="field">
        <label>ເບີຕິດຕໍ່</label>
        <input type="tel" id="phone" placeholder="020 XX XXX XXX" autocomplete="tel">
      </div>
      <div class="field">
        <label>ບົດບາດ</label>
        <div class="role-row">
          <label class="role-opt"><input type="radio" name="role" value="student" checked>
            <span class="role-box"><span class="ic">🎓</span>ນັກຮຽນ</span></label>
          <label class="role-opt"><input type="radio" name="role" value="teacher">
            <span class="role-box"><span class="ic">👨‍🏫</span>ອາຈານ</span></label>
        </div>
      </div>
      <div class="field">
        <label>ຊື່ຜູ້ໃຊ້ <span style="text-transform:none;letter-spacing:0;color:var(--text-muted)">(ໃຊ້ login, a-z 0-9 . _ )</span></label>
        <input type="text" id="username" placeholder="ເຊັ່ນ: souphan2026" autocomplete="username">
      </div>
    </div>

    <!-- ຊ່ອງຮ່ວມ (email/username + password) -->
    <div class="field">
      <label id="emailLabel">ອີເມວ</label>
      <input type="text" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>ລະຫັດຜ່ານ <span id="pwHint" style="text-transform:none;letter-spacing:0;color:var(--text-muted)">(ຢ່າງໜ້ອຍ 6 ໂຕ)</span></label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn" id="submitBtn" onclick="submitForm()">ສະໝັກສະມາຊິກ</button>

    <div class="msg" id="msg"></div>

    <div class="foot">
      <span id="footText">ມີບັນຊີແລ້ວ?</span>
      <a href="#" id="footLink" onclick="toggleMode();return false;">ເຂົ້າສູ່ລະບົບ</a>
      <br><br>
      <a href="index.html">← ກັບໄປໜ້າຕາຕະລາງ</a>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL  = 'https://zyofznchnzhqaazfvutv.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5b2Z6bmNobnpocWFhemZ2dXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODQ5OTQsImV4cCI6MjA5Njg2MDk5NH0.Pyh1dYPPIlAVE3glpGsVa5DnBTjBACTjARv3eBR0k7E';
const sb = supabase.createClient(SUPA_URL, SUPA_ANON);

let mode = 'signup';

function setMode(m){
  mode = m;
  const isSignup = m==='signup';
  document.getElementById('tabSignup').classList.toggle('active', isSignup);
  document.getElementById('tabLogin').classList.toggle('active', !isSignup);
  document.getElementById('signupOnly').classList.toggle('hide', !isSignup);
  document.getElementById('submitBtn').textContent = isSignup ? 'ສະໝັກສະມາຊິກ' : 'ເຂົ້າສູ່ລະບົບ';
  document.getElementById('password').setAttribute('autocomplete', isSignup?'new-password':'current-password');
  document.getElementById('pwHint').style.display = isSignup ? '' : 'none';
  document.getElementById('emailLabel').textContent = isSignup ? 'ອີເມວ' : 'ອີເມວ ຫຼື ຊື່ຜູ້ໃຊ້';
  document.getElementById('email').placeholder = isSignup ? 'you@example.com' : 'ອີເມວ ຫຼື ຊື່ຜູ້ໃຊ້';
  document.getElementById('footText').textContent = isSignup ? 'ມີບັນຊີແລ້ວ?' : 'ຍັງບໍ່ມີບັນຊີ?';
  document.getElementById('footLink').textContent = isSignup ? 'ເຂົ້າສູ່ລະບົບ' : 'ສະໝັກສະມາຊິກ';
  setMsg('');
}
function toggleMode(){ setMode(mode==='signup'?'login':'signup'); }

function setMsg(text, kind){
  const el = document.getElementById('msg');
  el.textContent = text || '';
  el.className = 'msg' + (kind?(' '+kind):'');
}

function getRole(){
  const r = document.querySelector('input[name="role"]:checked');
  return r ? r.value : 'student';
}

async function submitForm(){
  const idInput = document.getElementById('email').value.trim();  // signup=email · login=email ຫຼື username
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');

  if(mode==='signup'){
    const fullName = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const username = document.getElementById('username').value.trim();
    const email = idInput;
    if(!fullName){ setMsg('❌ ກະລຸນາໃສ່ຊື່-ນາມສະກຸນ','err'); return; }
    if(!/^[a-zA-Z0-9._]{3,20}$/.test(username)){ setMsg('❌ ຊື່ຜູ້ໃຊ້ຕ້ອງເປັນ a-z 0-9 . _ ຍາວ 3-20 ໂຕ','err'); return; }
    if(!email){ setMsg('❌ ກະລຸນາໃສ່ອີເມວ','err'); return; }
    if(password.length < 6){ setMsg('❌ ລະຫັດຜ່ານຕ້ອງຍາວຢ່າງໜ້ອຍ 6 ໂຕ','err'); return; }

    btn.disabled = true; setMsg('⏳ ກຳລັງສະໝັກ...');
    // ກວດຊື່ຜູ້ໃຊ້ຊ້ຳກ່ອນ
    const { data:avail, error:availErr } = await sb.rpc('username_available', { p_username: username });
    if(!availErr && avail === false){ btn.disabled=false; setMsg('❌ ຊື່ຜູ້ໃຊ້ "'+username+'" ຖືກໃຊ້ແລ້ວ — ກະລຸນາເລືອກອັນອື່ນ','err'); return; }

    const { data, error } = await sb.auth.signUp({
      email, password,
      options:{ data:{ full_name:fullName, phone, role:getRole(), username } }
    });
    btn.disabled = false;
    if(error){ setMsg('❌ '+laoErr(error.message),'err'); return; }

    if(data.session){
      setMsg('✅ ສະໝັກສຳເລັດ! ກຳລັງເຂົ້າສູ່ລະບົບ...','ok');
      setTimeout(()=>{ location.href='index.html'; }, 900);
    } else {
      setMsg('✅ ສະໝັກສຳເລັດ! ກະລຸນາກວດອີເມວເພື່ອຢືນຢັນ ແລ້ວຈຶ່ງເຂົ້າສູ່ລະບົບ.','ok');
      setMode('login');
    }
  } else {
    if(!idInput || !password){ setMsg('❌ ກະລຸນາໃສ່ອີເມວ/ຊື່ຜູ້ໃຊ້ ແລະ ລະຫັດຜ່ານ','err'); return; }
    btn.disabled = true; setMsg('⏳ ກຳລັງເຂົ້າສູ່ລະບົບ...');

    // ຖ້າບໍ່ແມ່ນ email (ບໍ່ມີ @) → ແປງ username ເປັນ email ກ່ອນ
    let email = idInput;
    if(!idInput.includes('@')){
      const { data:foundEmail, error:rpcErr } = await sb.rpc('email_for_username', { p_username: idInput });
      if(rpcErr || !foundEmail){ btn.disabled=false; setMsg('❌ ບໍ່ພົບຊື່ຜູ້ໃຊ້ນີ້','err'); return; }
      email = foundEmail;
    }

    const { error } = await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    if(error){ setMsg('❌ '+laoErr(error.message),'err'); return; }
    setMsg('✅ ເຂົ້າສຳເລັດ! ກຳລັງໄປໜ້າຕາຕະລາງ...','ok');
    setTimeout(()=>{ location.href='index.html'; }, 700);
  }
}

// ແປ error ທົ່ວໄປເປັນລາວ
function laoErr(m){
  m = m || '';
  if(/already registered|already been registered|exists/i.test(m)) return 'ອີເມວນີ້ຖືກສະໝັກໄວ້ແລ້ວ — ລອງເຂົ້າສູ່ລະບົບ';
  if(/invalid login credentials/i.test(m)) return 'ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ';
  if(/email not confirmed/i.test(m)) return 'ຍັງບໍ່ໄດ້ຢືນຢັນອີເມວ — ກະລຸນາກວດກ່ອງອີເມວ';
  if(/password should be at least/i.test(m)) return 'ລະຫັດຜ່ານສັ້ນເກີນໄປ (ຢ່າງໜ້ອຍ 6 ໂຕ)';
  if(/unable to validate email|invalid format/i.test(m)) return 'ຮູບແບບອີເມວບໍ່ຖືກຕ້ອງ';
  return m;
}

// ສະໝັກ Enter key
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') submitForm(); });

// ຖ້າ login ຢູ່ແລ້ວ → ກັບໄປໜ້າຕາຕະລາງ
(async()=>{
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ setMsg('ເຂົ້າສູ່ລະບົບຢູ່ແລ້ວ — ກຳລັງໄປໜ້າຕາຕະລາງ...','ok'); setTimeout(()=>location.href='index.html',600); }
})();
</script>
</body>
</html>
