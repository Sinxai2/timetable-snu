<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຈັດການສະມາຊິກ · admin · ມ.ສ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="members.css">
</head>
<body>
<div class="wrap">
  <!-- ໜ້າ admin ເທົ່ານັ້ນ -->
  <div id="gate" class="gate hide">
    <div style="font-size:38px;margin-bottom:10px">🔒</div>
    <div style="font-weight:700;font-size:16px;margin-bottom:8px">ສະເພາະ admin ເທົ່ານັ້ນ</div>
    <div class="muted" id="gateMsg" style="margin-bottom:18px">ກະລຸນາເຂົ້າສູ່ລະບົບ admin ກ່ອນ</div>
    <a href="index.html">← ກັບໄປໜ້າຫຼັກ</a>
  </div>

  <div id="content" class="hide">
    <header>
      <div style="display:flex;align-items:center;gap:12px">
        <img class="logo-img" src="logo.png" alt="ໂລໂກ້ ມ.ສ">
        <div>
          <div class="logo">ຈັດການສະມາຊິກ</div>
          <div class="sub">ອະນຸມັດ / ຈັດການ ນັກຮຽນ ແລະ ອາຈານ ທີ່ສະໝັກເຂົ້າມາ</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-back" onclick="loadMembers()">🔄 ໂຫລດໃໝ່</button>
        <a class="btn btn-back" href="index.html">← ກັບໄປຕາຕະລາງ</a>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><div class="n" id="cTotal">0</div><div class="l">ສະມາຊິກທັງໝົດ</div></div>
      <div class="stat pending"><div class="n" id="cPending">0</div><div class="l">ລໍຖ້າອະນຸມັດ</div></div>
      <div class="stat approved"><div class="n" id="cApproved">0</div><div class="l">ອະນຸມັດແລ້ວ</div></div>
    </div>

    <div class="toolbar">
      <button class="filterbtn active" data-f="all" onclick="setFilter('all')">ທັງໝົດ</button>
      <button class="filterbtn" data-f="pending" onclick="setFilter('pending')">ລໍຖ້າອະນຸມັດ</button>
      <button class="filterbtn" data-f="approved" onclick="setFilter('approved')">ອະນຸມັດແລ້ວ</button>
      <button class="filterbtn" data-f="teacher" onclick="setFilter('teacher')">ອາຈານ</button>
      <button class="filterbtn" data-f="student" onclick="setFilter('student')">ນັກຮຽນ</button>
    </div>

    <div class="card">
      <table>
        <thead><tr>
          <th>ຊື່ - ນາມສະກຸນ</th><th>ບົດບາດ</th><th>ຊື່ຜູ້ໃຊ້</th>
          <th>ເບີ</th><th>ອີເມວ</th><th>ສະຖານະ</th><th style="text-align:right">ຈັດການ</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="center">ກຳລັງໂຫລດ...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL  = 'https://zyofznchnzhqaazfvutv.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5b2Z6bmNobnpocWFhemZ2dXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODQ5OTQsImV4cCI6MjA5Njg2MDk5NH0.Pyh1dYPPIlAVE3glpGsVa5DnBTjBACTjARv3eBR0k7E';
const sb = supabase.createClient(SUPA_URL, SUPA_ANON);

let members = [];
let filter = 'all';

function showGate(msg){
  document.getElementById('gate').classList.remove('hide');
  document.getElementById('content').classList.add('hide');
  if(msg) document.getElementById('gateMsg').textContent = msg;
}

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ showGate('ກະລຸນາເຂົ້າສູ່ລະບົບ admin ດ້ວຍ Google ກ່ອນ (ໜ້າຫຼັກ)'); return; }
  const { data:isAdmin } = await sb.rpc('is_admin');
  if(isAdmin !== true){ showGate('ບັນຊີນີ້ບໍ່ມີສິດ admin'); return; }
  document.getElementById('gate').classList.add('hide');
  document.getElementById('content').classList.remove('hide');
  loadMembers();
}

async function loadMembers(){
  document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="center">ກຳລັງໂຫລດ...</td></tr>';
  const { data, error } = await sb.rpc('admin_list_members');
  if(error){ document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="center">❌ '+error.message+'</td></tr>'; return; }
  members = data || [];
  render();
}

function setFilter(f){
  filter = f;
  document.querySelectorAll('.filterbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f));
  render();
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const total = members.length;
  const pending = members.filter(m=>!m.approved).length;
  document.getElementById('cTotal').textContent = total;
  document.getElementById('cPending').textContent = pending;
  document.getElementById('cApproved').textContent = total - pending;

  let list = members.slice();
  if(filter==='pending') list = list.filter(m=>!m.approved);
  else if(filter==='approved') list = list.filter(m=>m.approved);
  else if(filter==='teacher') list = list.filter(m=>m.role==='teacher');
  else if(filter==='student') list = list.filter(m=>m.role==='student');

  if(!list.length){ document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="center">ບໍ່ມີສະມາຊິກໃນໝວດນີ້</td></tr>'; return; }

  document.getElementById('rows').innerHTML = list.map(m=>{
    const roleTag = m.role==='teacher'
      ? '<span class="role-tag teacher">👨‍🏫 ອາຈານ</span>'
      : '<span class="role-tag student">🎓 ນັກຮຽນ</span>';
    const statusBadges =
      (m.approved ? '<span class="badge ok">✓ ອະນຸມັດແລ້ວ</span>' : '<span class="badge no">⏳ ລໍຖ້າ</span>')
      + (m.email_confirmed ? '' : ' <span class="badge unconf">ຍັງບໍ່ຢືນຢັນອີເມວ</span>');
    const actions = m.approved
      ? `<button class="btn-sm btn-undo" onclick="setApproved('${m.id}',false)">ຍົກເລີກ</button>`
      : `<button class="btn-sm btn-ok" onclick="setApproved('${m.id}',true)">✓ ອະນຸມັດ</button>`;
    return `<tr>
      <td>${esc(m.full_name)||'<span class="muted">(ບໍ່ມີ)</span>'}</td>
      <td>${roleTag}</td>
      <td>${esc(m.username)||'<span class="muted">—</span>'}</td>
      <td>${esc(m.phone)||'<span class="muted">—</span>'}</td>
      <td class="muted">${esc(m.email)}</td>
      <td>${statusBadges}</td>
      <td><div class="act" style="justify-content:flex-end">
        ${actions}
        <button class="btn-sm btn-del" onclick="delMember('${m.id}','${esc(m.full_name)||esc(m.email)}')">ລົບ</button>
      </div></td>
    </tr>`;
  }).join('');
}

async function setApproved(id, val){
  const { error } = await sb.rpc('admin_set_approved', { p_id:id, p_approved:val });
  if(error){ alert('❌ '+error.message); return; }
  const m = members.find(x=>x.id===id); if(m) m.approved = val;
  render();
}

async function delMember(id, name){
  if(!confirm('ລົບສະມາຊິກ "'+name+'" ຖາວອນ?\nການກະທຳນີ້ຍ້ອນກັບບໍ່ໄດ້.')) return;
  const { error } = await sb.rpc('admin_delete_member', { p_id:id });
  if(error){ alert('❌ '+error.message); return; }
  members = members.filter(x=>x.id!==id);
  render();
}

init();
</script>
</body>
</html>
