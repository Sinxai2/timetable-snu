<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຈັດການສະມາຊິກ · admin · ມ.ສ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a12; --surface:#12121e; --panel:#1a1a2e; --border:#252540;
  --accent:#6c63ff; --accent2:#ff6584; --accent3:#43e97b; --warn:#f7c46a;
  --text:#e8e8f5; --text-muted:#6868a0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Lao',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 50% at 15% 10%,rgba(108,99,255,.1) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 85% 85%,rgba(255,101,132,.07) 0%,transparent 60%);
  pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:24px 18px 60px;}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.logo{font-family:'Bebas Neue',cursive;font-size:24px;letter-spacing:3px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:'Noto Sans Lao',sans-serif;font-size:12px;font-weight:700;transition:all .18s;text-decoration:none;display:inline-block;}
.btn-back{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
.btn-back:hover{border-color:var(--accent);color:var(--accent);}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.stat{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.stat .n{font-size:24px;font-weight:700;}
.stat .l{font-size:11px;color:var(--text-muted);margin-top:2px;}
.stat.pending .n{color:var(--warn);}
.stat.approved .n{color:var(--accent3);}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.filterbtn{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--text-muted);font-family:'Noto Sans Lao',sans-serif;font-size:12px;font-weight:700;cursor:pointer;}
.filterbtn.active{background:linear-gradient(135deg,var(--accent),#9c8eff);color:#fff;border-color:transparent;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle;}
th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);font-weight:700;background:var(--panel);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(108,99,255,.04);}
.role-tag{font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;}
.role-tag.teacher{background:rgba(67,233,123,.12);color:var(--accent3);}
.role-tag.student{background:rgba(108,99,255,.12);color:#a89cff;}
.badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;white-space:nowrap;}
.badge.ok{background:rgba(67,233,123,.12);color:var(--accent3);}
.badge.no{background:rgba(247,196,106,.12);color:var(--warn);}
.badge.unconf{background:rgba(255,101,132,.12);color:var(--accent2);}
.act{display:flex;gap:6px;}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:7px;border:none;cursor:pointer;font-family:'Noto Sans Lao',sans-serif;font-weight:700;}
.btn-ok{background:rgba(67,233,123,.14);color:var(--accent3);border:1px solid rgba(67,233,123,.3);}
.btn-ok:hover{background:rgba(67,233,123,.26);}
.btn-undo{background:rgba(247,196,106,.12);color:var(--warn);border:1px solid rgba(247,196,106,.3);}
.btn-del{background:rgba(255,101,132,.1);color:var(--accent2);border:1px solid rgba(255,101,132,.25);}
.btn-del:hover{background:rgba(255,101,132,.22);}
.muted{color:var(--text-muted);font-size:11px;}
.center{text-align:center;padding:40px 16px;color:var(--text-muted);}
.gate{max-width:420px;margin:80px auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;text-align:center;}
.gate a{color:var(--accent);font-weight:700;text-decoration:none;}
.hide{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <!-- ໜ້າ admin ເທົ່ານັ້ນ -->
  <div id="gate" class="gate hide">
    <div style="font-size:38px;margin-bottom:10px">🔒</div>
    <div style="font-weight:700;font-size:16px;margin-bottom:8px">ສະເພາະ admin ເທົ່ານັ້ນ</div>
    <div class="muted" id="gateMsg" style="margin-bottom:18px">ກະລຸນາເຂົ້າສູ່ລະບົບ admin ກ່ອນ</div>
    <a href="index.html">← ກັບໄປໜ້າຫຼັກ</a>
  </div>

  <div id="content" class="hide">
    <header>
      <div>
        <div class="logo">ຈັດການສະມາຊິກ</div>
        <div class="sub">ອະນຸມັດ / ຈັດການ ນັກຮຽນ ແລະ ອາຈານ ທີ່ສະໝັກເຂົ້າມາ</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-back" onclick="loadMembers()">🔄 ໂຫລດໃໝ່</button>
        <a class="btn btn-back" href="index.html">← ກັບໄປຕາຕະລາງ</a>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><div class="n" id="cTotal">0</div><div class="l">ສະມາຊິກທັງໝົດ</div></div>
      <div class="stat pending"><div class="n" id="cPending">0</div><div class="l">ລໍຖ້າອະນຸມັດ</div></div>
      <div class="stat approved"><div class="n" id="cApproved">0</div><div class="l">ອະນຸມັດແລ້ວ</div></div>
    </div>

    <div class="toolbar">
      <button class="filterbtn active" data-f="all" onclick="setFilter('all')">ທັງໝົດ</button>
      <button class="filterbtn" data-f="pending" onclick="setFilter('pending')">ລໍຖ້າອະນຸມັດ</button>
      <button class="filterbtn" data-f="approved" onclick="setFilter('approved')">ອະນຸມັດແລ້ວ</button>
      <button class="filterbtn" data-f="teacher" onclick="setFilter('teacher')">ອາຈານ</button>
      <button class="filterbtn" data-f="student" onclick="setFilter('student')">ນັກຮຽນ</button>
    </div>

    <div class="card">
      <table>
        <thead><tr>
          <th>ຊື່ - ນາມສະກຸນ</th><th>ບົດບາດ</th><th>ຊື່ຜູ້ໃຊ້</th>
          <th>ເບີ</th><th>ອີເມວ</th><th>ສະຖານະ</th><th style="text-align:right">ຈັດການ</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="center">ກຳລັງໂຫລດ...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL  = 'https://zyofznchnzhqaazfvutv.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5b2Z6bmNobnpocWFhemZ2dXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODQ5OTQsImV4cCI6MjA5Njg2MDk5NH0.Pyh1dYPPIlAVE3glpGsVa5DnBTjBACTjARv3eBR0k7E';
const sb = supabase.createClient(SUPA_URL, SUPA_ANON);

let members = [];
let filter = 'all';

function showGate(msg){
  document.getElementById('gate').classList.remove('hide');
  document.getElementById('content').classList.add('hide');
  if(msg) document.getElementById('gateMsg').textContent = msg;
}

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ showGate('ກະລຸນາເຂົ້າສູ່ລະບົບ admin ດ້ວຍ Google ກ່ອນ (ໜ້າຫຼັກ)'); return; }
  const { data:isAdmin } = await sb.rpc('is_admin');
  if(isAdmin !== true){ showGate('ບັນຊີນີ້ບໍ່ມີສິດ admin'); return; }
  document.getElementById('gate').classList.add('hide');
  document.getElementById('content').classList.remove('hide');
  loadMembers();
}

async function loadMembers(){
  document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="center">ກຳລັງໂຫລດ...</td></tr>';
  const { data, error } = await sb.rpc('admin_list_members');
  if(error){ document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="center">❌ '+error.message+'</td></tr>'; return; }
  members = data || [];
  render();
}

function setFilter(f){
  filter = f;
  document.querySelectorAll('.filterbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f));
  render();
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const total = members.length;
  const pending = members.filter(m=>!m.approved).length;
  document.getElementById('cTotal').textContent = total;
  document.getElementById('cPending').textContent = pending;
  document.getElementById('cApproved').textContent = total - pending;

  let list = members.slice();
  if(filter==='pending') list = list.filter(m=>!m.approved);
  else if(filter==='approved') list = list.filter(m=>m.approved);
  else if(filter==='teacher') list = list.filter(m=>m.role==='teacher');
  else if(filter==='student') list = list.filter(m=>m.role==='student');

  if(!list.length){ document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="center">ບໍ່ມີສະມາຊິກໃນໝວດນີ້</td></tr>'; return; }

  document.getElementById('rows').innerHTML = list.map(m=>{
    const roleTag = m.role==='teacher'
      ? '<span class="role-tag teacher">👨‍🏫 ອາຈານ</span>'
      : '<span class="role-tag student">🎓 ນັກຮຽນ</span>';
    const statusBadges =
      (m.approved ? '<span class="badge ok">✓ ອະນຸມັດແລ້ວ</span>' : '<span class="badge no">⏳ ລໍຖ້າ</span>')
      + (m.email_confirmed ? '' : ' <span class="badge unconf">ຍັງບໍ່ຢືນຢັນອີເມວ</span>');
    const actions = m.approved
      ? `<button class="btn-sm btn-undo" onclick="setApproved('${m.id}',false)">ຍົກເລີກ</button>`
      : `<button class="btn-sm btn-ok" onclick="setApproved('${m.id}',true)">✓ ອະນຸມັດ</button>`;
    return `<tr>
      <td>${esc(m.full_name)||'<span class="muted">(ບໍ່ມີ)</span>'}</td>
      <td>${roleTag}</td>
      <td>${esc(m.username)||'<span class="muted">—</span>'}</td>
      <td>${esc(m.phone)||'<span class="muted">—</span>'}</td>
      <td class="muted">${esc(m.email)}</td>
      <td>${statusBadges}</td>
      <td><div class="act" style="justify-content:flex-end">
        ${actions}
        <button class="btn-sm btn-del" onclick="delMember('${m.id}','${esc(m.full_name)||esc(m.email)}')">ລົບ</button>
      </div></td>
    </tr>`;
  }).join('');
}

async function setApproved(id, val){
  const { error } = await sb.rpc('admin_set_approved', { p_id:id, p_approved:val });
  if(error){ alert('❌ '+error.message); return; }
  const m = members.find(x=>x.id===id); if(m) m.approved = val;
  render();
}

async function delMember(id, name){
  if(!confirm('ລົບສະມາຊິກ "'+name+'" ຖາວອນ?\nການກະທຳນີ້ຍ້ອນກັບບໍ່ໄດ້.')) return;
  const { error } = await sb.rpc('admin_delete_member', { p_id:id });
  if(error){ alert('❌ '+error.message); return; }
  members = members.filter(x=>x.id!==id);
  render();
}

init();
</script>
</body>
</html>
