<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຕັ້ງລະຫັດຜ່ານໃໝ່ · ມ.ສ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a12; --surface:#12121e; --panel:#1a1a2e; --border:#252540;
  --accent:#6c63ff; --accent2:#ff6584; --accent3:#43e97b;
  --text:#e8e8f5; --text-muted:#6868a0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans Lao',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 50% at 15% 10%,rgba(108,99,255,.1) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 85% 85%,rgba(255,101,132,.07) 0%,transparent 60%);
  pointer-events:none;z-index:0;}
.card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:38px 34px;width:420px;max-width:96vw;box-shadow:0 40px 100px rgba(0,0,0,.7);}
.brand{text-align:center;margin-bottom:22px;}
.brand .logo-text{font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand .logo-sub{font-size:12px;color:var(--text-muted);margin-top:4px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
.field input{width:100%;background:var(--panel);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:12px 14px;font-family:'Noto Sans Lao',sans-serif;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,.18);}
.btn{width:100%;padding:13px;margin-top:8px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),#9c8eff);color:#fff;font-family:'Noto Sans Lao',sans-serif;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(108,99,255,.4);transition:all .2s;}
.btn:hover{transform:translateY(-2px);}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
.msg{font-size:12.5px;text-align:center;min-height:18px;margin-top:12px;line-height:1.7;}
.msg.err{color:var(--accent2);}
.msg.ok{color:var(--accent3);}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--text-muted);}
.foot a{color:var(--accent);text-decoration:none;font-weight:700;}
.center{text-align:center;color:var(--text-muted);font-size:13px;line-height:1.8;}
.hide{display:none!important;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo-text">SNU TIMETABLE</div>
      <div class="logo-sub">ຕັ້ງລະຫັດຜ່ານໃໝ່</div>
    </div>

    <!-- ກຳລັງກວດລິ້ງ -->
    <div id="checking" class="center">⏳ ກຳລັງກວດລິ້ງ...</div>

    <!-- ຟອມຕັ້ງລະຫັດໃໝ່ -->
    <div id="form" class="hide">
      <div class="field">
        <label>ລະຫັດຜ່ານໃໝ່ <span style="text-transform:none;letter-spacing:0;color:var(--text-muted)">(ຢ່າງໜ້ອຍ 6 ໂຕ)</span></label>
        <input type="password" id="pw1" placeholder="••••••••" autocomplete="new-password">
      </div>
      <div class="field">
        <label>ຢືນຢັນລະຫັດຜ່ານໃໝ່</label>
        <input type="password" id="pw2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn" id="saveBtn" onclick="savePassword()">ບັນທຶກລະຫັດໃໝ່</button>
    </div>

    <!-- ລິ້ງໝົດອາຍຸ/ບໍ່ຖືກຕ້ອງ -->
    <div id="invalid" class="hide center">
      ❌ ລິ້ງບໍ່ຖືກຕ້ອງ ຫຼື ໝົດອາຍຸແລ້ວ.<br>
      ກະລຸນາຂໍລິ້ງໃໝ່ຈາກໜ້າ <a href="register.html">ເຂົ້າສູ່ລະບົບ → ລືມລະຫັດຜ່ານ</a>
    </div>

    <div class="msg" id="msg"></div>
    <div class="foot"><a href="register.html">← ກັບໄປໜ້າເຂົ້າສູ່ລະບົບ</a></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL  = 'https://zyofznchnzhqaazfvutv.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5b2Z6bmNobnpocWFhemZ2dXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyODQ5OTQsImV4cCI6MjA5Njg2MDk5NH0.Pyh1dYPPIlAVE3glpGsVa5DnBTjBACTjARv3eBR0k7E';
const sb = supabase.createClient(SUPA_URL, SUPA_ANON);

function setMsg(t,k){ const e=document.getElementById('msg'); e.textContent=t||''; e.className='msg'+(k?(' '+k):''); }
function show(id){ ['checking','form','invalid'].forEach(x=>document.getElementById(x).classList.toggle('hide', x!==id)); }

let ready = false;

// supabase-js ຈັບ token ໃນ URL ອັດຕະໂນມັດ ແລ້ວຍິງ event PASSWORD_RECOVERY
sb.auth.onAuthStateChange((event, session)=>{
  if(event === 'PASSWORD_RECOVERY' || (session && !ready)){ ready = true; show('form'); }
});

// ສຳຮອງ: ກວດ session ຫຼັງໂຫລດ (ເຜື່ອ event ຍິງກ່ອນ listener)
(async()=>{
  await new Promise(r=>setTimeout(r,800));
  if(ready) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ ready = true; show('form'); }
  else show('invalid');
})();

async function savePassword(){
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;
  if(pw1.length < 6){ setMsg('❌ ລະຫັດຜ່ານຕ້ອງຍາວຢ່າງໜ້ອຍ 6 ໂຕ','err'); return; }
  if(pw1 !== pw2){ setMsg('❌ ລະຫັດຜ່ານສອງຊ່ອງບໍ່ກົງກັນ','err'); return; }
  const btn = document.getElementById('saveBtn'); btn.disabled = true; setMsg('⏳ ກຳລັງບັນທຶກ...');
  const { error } = await sb.auth.updateUser({ password: pw1 });
  btn.disabled = false;
  if(error){ setMsg('❌ '+error.message,'err'); return; }
  setMsg('✅ ປ່ຽນລະຫັດຜ່ານສຳເລັດ! ກຳລັງໄປໜ້າເຂົ້າສູ່ລະບົບ...','ok');
  await sb.auth.signOut();
  setTimeout(()=>{ location.href='register.html'; }, 1400);
}

document.getElementById('pw2').addEventListener('keydown', e=>{ if(e.key==='Enter') savePassword(); });
</script>
</body>
</html>
